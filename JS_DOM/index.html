<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Store</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        #root {
            display: flex;
            justify-content: center;
        }

        .Booklist {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            width: 220px;
            padding: 20px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .card img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .card h2 {
            color: red;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>Book Store</h1>

    <div id="root"></div>

    <!-- React -->
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>

    <!-- ReactDOM -->
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>

    <!-- Your JavaScript -->
    <script src="index.js"></script>

</body>
</html>
